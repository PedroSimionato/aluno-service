version: "3.9"

services:
    app:
        build: .
        ports:
        - "8080:8080"
        depends_on:
          - db
        environment:
          DB_HOST: db
          DB_PORT: 5432
          DB_NAME: mydatabase
          DB_USER: myuser
          DB_PASSWORD: mypassword

    db:
      image: postgres:15
      container_name: postgres
      restart: always
      environment:
        POSTGRES_DB: mydatabase
        POSTGRES_USER: myuser
        POSTGRES_PASSWORD: mypassword
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:
